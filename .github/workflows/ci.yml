name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node >=22 required: the `npm test` script passes Next.js dynamic-route
          # paths like app/api/account/contacts/[id]/route.test.mjs to `node --test`
          # using POSIX bracket-escaping ('[[]id[]]'). node 20's test runner has no
          # glob support and reads that arg literally -> "Could not find" -> exit 1.
          # node >=22's runner glob-expands it correctly. See .nvmrc.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests (Node test runner + Vitest)
        run: npm test
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Build
        run: npm run build
        env:
          CLEAN_SHEET_API_URL: https://placeholder.invalid
          NEATEXPORT_API_KEY: placeholder
          BACKEND_CHECKOUT_URL: https://placeholder.invalid
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ''
