name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests (Node test runner + Vitest)
        run: npm test
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Build
        run: npm run build
        env:
          CLEAN_SHEET_API_URL: https://placeholder.invalid
          NEATEXPORT_API_KEY: placeholder
          BACKEND_CHECKOUT_URL: https://placeholder.invalid
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ''
